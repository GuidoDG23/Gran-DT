        function getPts(eq) { return eq.pg * 3 + eq.pp; }
        function getDiff(eq) { return eq.gf - eq.gc; }
        
        function updatePuntajes() {
            const todos = [...state.argentina.A, ...state.argentina.B];
            todos.forEach(jugador => {
                const puntajes = state.resultados[jugador.name] || [];
                jugador.pj = puntajes.filter(p => p > 0).length;
                jugador.pts = puntajes.reduce((sum, p) => sum + (parseInt(p) || 0), 0);
            });
        }
        
        function updateResultado(jugador, fecha, valor) {
            if (!state.resultados[jugador]) {
                state.resultados[jugador] = Array(13).fill(0);
            }
            state.resultados[jugador][fecha] = parseInt(valor) || 0;
            updatePuntajes();
            render();
        }

        function sortTeams(teams) {
            return [...teams].sort((a, b) => {
                const ptsA = getPts(a), ptsB = getPts(b);
                return ptsB - ptsA || getDiff(b) - getDiff(a) || b.gf - a.gf;
            });
        }

        function getBadgeClass(i) {
            const classes = ['badge-1', 'badge-2', 'badge-3', 'badge-4', 'badge-5'];
            return classes[Math.min(i, 4)];
        }

        function renderTeamRow(team, pos) {
            return `<div class="grid grid-cols-5 gap-2 p-2 border-b border-slate-700 text-sm">
                <div class="badge ${getBadgeClass(pos)}">${pos + 1}</div>
                <div class="text-slate-200">${team.name}</div>
                <div class="text-center text-slate-400">${team.pj}</div>
                <div class="text-center text-green-400 font-bold">${team.pts}</div>
            </div>`;
        }

        function renderGrupo(teams, titulo, color = 'blue') {
            const sorted = sortTeams(teams);
            const colorClass = color === 'cyan' ? 'border-cyan-500 bg-cyan-500/10' : 'border-blue-500 bg-blue-500/10';
            const colorText = color === 'cyan' ? 'text-cyan-400' : 'text-blue-400';
            
            let html = `<div class="border-2 ${colorClass} rounded-lg overflow-hidden">
                <div class="bg-gradient-to-r ${color === 'cyan' ? 'from-teal-900' : 'from-blue-900'} to-slate-900 p-3 border-b ${color === 'cyan' ? 'border-cyan-500' : 'border-blue-500'}">
                    <h3 class="${colorText} font-bold text-lg">${titulo}</h3>
                    <p class="text-slate-400 text-xs">7 equipos</p>
                </div>
                <div class="grid grid-cols-5 gap-2 p-2 font-bold ${colorText} text-xs border-b ${color === 'cyan' ? 'border-cyan-500' : 'border-blue-500'} ${color === 'cyan' ? 'bg-cyan-500/5' : 'bg-blue-500/5'}">
                    <div>#</div><div>Equipo</div><div class="text-center">PJ</div><div class="text-center">PTS</div>
                </div>`;
            
            sorted.forEach((team, i) => {
                html += renderTeamRow(team, i);
            });
            
            html += '</div>';
            return html;
        }

                <button onclick="state.mainTab='libertadores'; state.subTab='grupos'; render()" class="px-4 py-2 rounded ${state.mainTab === 'libertadores' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">🏆 Copa Libertadores</button>
                <button onclick="state.mainTab='sudamericana'; state.subTab='grupos'; render()" class="px-4 py-2 rounded ${state.mainTab === 'sudamericana' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'} font-bold text-sm">🏆 Copa Sudamericana</button>

                                    </tr>
                                </thead>
                                <tbody>`;
                    
                    promedios.forEach((item, idx) => {
                        const [jugador, promedio] = item;
                        const bgColor = idx % 2 === 0 ? 'rgba(15, 23, 42, 0.5)' : 'rgba(30, 41, 59, 0.8)';
                        
                        html += `<tr style="background: ${bgColor}; border-bottom: 1px solid #475569;">
                            <td style="padding: 12px; color: text-slate-200; border-right: 1px solid #475569;">${jugador}</td>
                            <td style="padding: 12px; text-align: center; color: #cbd5e1; font-weight: bold;">${promedio.toFixed(2)}</td>
                        </tr>`;
                    });
                    
                    html += `</tbody></table>
                        </div>
                    </div>`;
                }
            }

            html += `</div>`;
            document.getElementById('app').innerHTML = html;
        }

        render();
    </script>
</body>
</html>
