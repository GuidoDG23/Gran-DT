            riestra: { alts: ['deportivo-riestra', 'club-deportivo-riestra'], sigla: 'RIE' },
            platense: { alts: ['club-atletico-platense', 'ca-platense'], sigla: 'PLA' }

            const m = el.src.match(/previews\/([^\/]+)\/[^\/]+-logo-footylogos-320\.webp/);
            if (!m) return;
            const cur = m[1];
            const key = Object.keys(LOGO_ALIAS).find(k => k === cur || LOGO_ALIAS[k].alts.includes(cur));

            const lista = [key, ...LOGO_ALIAS[key].alts];
            const next = lista[lista.indexOf(cur) + 1];

                el.src = `https://assets.footylogos.com/previews/${next}/${next}-logo-footylogos-320.webp`;

                // Volver al primer logo del club en lugar de mostrar la sigla

        function getPts(eq) { return eq.pg * 3 + eq.pp; }
        function getDiff(eq) { return eq.gf - eq.gc; }
        
        function updatePuntajes() {
            const todos = [...state.argentina.A, ...state.argentina.B];
            todos.forEach(jugador => {
                const puntajes = state.resultados[jugador.name] || [];
                jugador.pj = puntajes.filter(p => p > 0).length;
                jugador.pts = puntajes.reduce((sum, p) => sum + (parseInt(p) || 0), 0);
            });
        }
        
        function updateResultado(jugador, fecha, valor) {
            if (!state.resultados[jugador]) {
                state.resultados[jugador] = Array(13).fill(0);
            }
            state.resultados[jugador][fecha] = parseInt(valor) || 0;
            updatePuntajes();
            render();
        }

        function sortTeams(teams) {
            return [...teams].sort((a, b) => {
                // Si tiene 'pts' directo (Copa Argentina), usar ese
                if (a.pts !== undefined && b.pts !== undefined) {
                    return b.pts - a.pts;
                }
                // Si no, calcular desde pg y pp (otros torneos)
                const ptsA = getPts(a), ptsB = getPts(b);
                return ptsB - ptsA || getDiff(b) - getDiff(a) || b.gf - a.gf;
            });
        }
